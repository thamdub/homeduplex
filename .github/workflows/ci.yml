name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: azure/setup-helm@v4  # for the chart tests
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src tests
      - run: uv run pytest

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Lint and validate with each example values file
        run: |
          for values in charts/homeduplex/ci/*-values.yaml; do
            echo "::group::$values"
            helm lint --strict charts/homeduplex -f "$values"
            helm template test charts/homeduplex -f "$values" | kubeconform -strict -summary -
            echo "::endgroup::"
          done

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: homeduplex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run as Kubernetes would (non-root, read-only root filesystem)
        run: |
          docker run --rm --read-only --user 10001 \
            -v "$PWD/examples:/examples:ro" homeduplex:ci check-config -c /examples/wyoming-ollama.yaml
          docker run -d --name homeduplex --read-only --user 10001 -p 8770:8770 \
            -v "$PWD/examples/openai-compatible.yaml:/config/homeduplex.yaml:ro" homeduplex:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8770/healthz; then exit 0; fi
            sleep 1
          done
          docker logs homeduplex
          exit 1
