# Publishes a release when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0):
#   - the image, ghcr.io/<owner>/homeduplex:<version> (amd64 and arm64), also tagged <major>.<minor> and latest;
#   - the Helm chart, oci://ghcr.io/<owner>/charts/homeduplex, version <version>;
#   - a GitHub release with generated notes.
# The tag must match __version__ in src/homeduplex/__init__.py. Runs on GitHub's runners only.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code=$(sed -nE 's/^__version__ = "(.*)"$/\1/p' src/homeduplex/__init__.py)
          if [ "$tag" != "$code" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ = $code"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/homeduplex
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push the chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package charts/homeduplex --version "$VERSION" --app-version "$VERSION" -d dist
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/homeduplex-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

  github-release:
    needs: [version, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "homeduplex $VERSION" \
            --generate-notes --notes "Image: \`ghcr.io/${{ github.repository_owner }}/homeduplex:$VERSION\`
          Chart: \`helm install homeduplex oci://ghcr.io/${{ github.repository_owner }}/charts/homeduplex --version $VERSION\`"
