apiVersion: v1
kind: Service
metadata:
  name: {{ include "homeduplex.fullname" . }}
  labels:
    {{- include "homeduplex.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "homeduplex.selectorLabels" . | nindent 4 }}
  ports:
    - name: realtime
      port: {{ .Values.service.port }}
      targetPort: realtime
      protocol: TCP
